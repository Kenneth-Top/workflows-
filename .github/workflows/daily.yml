name: Update Database

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0点运行
  workflow_dispatch:      # 允许手动点按钮运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4

      - name: Update token history
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python update_data.py

      - name: Update OpenRouter pricing
        continue-on-error: true
        run: python openrouter_pricing_scraper.py

      - name: Update Artificial Analysis pricing
        continue-on-error: true
        run: python artificial_analysis_pricing_scraper.py

      - name: Build AI market event library
        continue-on-error: true
        run: python ai_market_events_builder.py

      - name: Update OpenRouter benchmark
        continue-on-error: true
        run: python openrouter_benchmark_scraper.py

      - name: Update LMARENA leaderboard
        continue-on-error: true
        run: python lmarena_scraper.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add history_database.csv
          git add openrouter_pricing_provider_records.csv
          git add artificial_analysis_pricing.csv
          git add artificial_analysis_pricing.json
          git add ai_market_events.json
          git add openrouter_benchmark_records.csv
          git add lmarena_leaderboard_records.csv
          # 如果没有变化（例如今天的数据还没出来），commit 会失败，所以加上 || exit 0 不报错
          git commit -m "Auto-update databases" || exit 0
          git pull --rebase origin main
          git push

