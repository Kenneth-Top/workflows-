name: Monitor GLM Coding Plan

on:
  schedule:
    - cron: '0 21 * * *' # 北京时间次日 05:00，提前占住 runner，避免 GitHub 调度延迟错过 10:00 窗口
  push:
    branches:
      - main
    paths:
      - 'glm_coding_plan_monitor.py'
      - '.github/workflows/glm_coding_plan_monitor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-glm-coding-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Monitor GLM Coding Plan
        env:
          BIGMODEL_AUTHORIZATION: ${{ secrets.BIGMODEL_AUTHORIZATION }}
          BIGMODEL_COOKIE: ${{ secrets.BIGMODEL_COOKIE }}
        run: python glm_coding_plan_monitor.py --poll-interval 0.5 --api-timeout 2 --page-monitor --page-poll-interval 5

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add glm_coding_plan_history.csv
          git add glm_coding_plan_snapshots.json
          git commit -m "Auto-update GLM Coding Plan monitor" || exit 0
          git pull --rebase origin main
          git push
